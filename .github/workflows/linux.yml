name: Linux build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        id: build
        run: |
          chmod +x ./linux_build.sh
          ./linux_build.sh

      - name: Publish AppImage
        uses: ./.github/actions/ftp-upload
        with:
          path: Aseprite.AppImage
          remote-name: Aseprite.AppImage
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWD }}
          remote-dir: ${{ secrets.FTP_PATH }}

      - name: Publish Linux build
        uses: ./.github/actions/ftp-upload
        with:
          path: aseprite-${{ steps.build.outputs.ASEPRITE_VERSION }}
          remote-name: aseprite-linux.zip
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWD }}
          remote-dir: ${{ secrets.FTP_PATH }}
