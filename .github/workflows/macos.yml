name: macOS build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        id: build
        run: |
          chmod +x ./macos_build.sh
          ./macos_build.sh

      - name: Publish macOS build
        uses: ./.github/actions/ftp-upload
        with:
          path: aseprite-${{ steps.build.outputs.ASEPRITE_VERSION }}
          remote-name: aseprite-macos.zip
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWD }}
          remote-dir: ${{ secrets.FTP_PATH }}
