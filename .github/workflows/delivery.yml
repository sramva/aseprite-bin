name: Delivery image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aseprite-bin-delivery

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          # `latest=auto` (the default) never marks a branch ref as latest, so a
          # push on master only published `master` and `sha-<sha>`. Only `auto`,
          # `true` and `false` are valid values, `always` errors out.
          flavor: |
            latest=true

      # Without an explicit buildx setup the default builder uses the `docker`
      # driver, which rejects `type=gha` cache export unless the runner has the
      # containerd image store enabled. GitHub's runners do not.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./delivery
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max