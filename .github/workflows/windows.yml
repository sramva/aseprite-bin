name: Windows build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        id: build
        shell: cmd
        run: call windows_build.cmd

      - name: Publish Windows build
        uses: ./.github/actions/ftp-upload
        with:
          path: aseprite-${{ steps.build.outputs.ASEPRITE_VERSION }}
          remote-name: aseprite-windows.zip
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWD }}
          remote-dir: ${{ secrets.FTP_PATH }}
